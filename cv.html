        <style>
    .cv-tree {
  margin: 18px auto; 
  overflow-x: hidden; 
  max-width: 1600px;
  width: 100%;
}
.cv-tree details {
  margin: 0;
}
.cv-tree summary.cv-tree-title {
  color: #369;
  font-size: 1.2em;
  cursor: pointer;
  padding: 4px 0;
  list-style: revert;
}
.cv-tree-children {
  margin: 8px 0 0 12px;
  padding: 0;
}
.tree-item {
  position: relative;
  margin: 6px 0;
  padding-left: 24px;
  line-height: 1.7;
  font-size: 0.88em;
}
.tree-item::before {
  content: "├─";
  position: absolute;
  left: 0;
  top: 0;
  color: #aaa;
}
.tree-item.last::before {
  content: "└─";
}

/* 改为两栏：学校占65%，时间35%，全部左对齐，保留gap控制间距 */
.tree-row {
  display: grid;
  grid-template-columns: 65% 35%;
  gap: 20px;
  width: 100%;
}
.school-name {
  white-space: nowrap;
  text-align: left;
}
.time {
  white-space: nowrap;
  text-align: left;
  color:#666;
}

/* 自定义折叠三角，清除浏览器默认 */
.tree-item details summary {
  list-style:none;
  cursor:pointer;
  position:relative;
  padding-left:20px;
}
.tree-item details summary::-webkit-details-marker {
  display:none;
}
.tree-item details summary::before {
  content:"▶";
  position:absolute;
  left:0;
  top:1px;
  font-size:11px;
  color:#666;
}
.tree-item details[open] summary::before{
  content:"▼";
}

/* 专业子条目：下移，更小字号，拉开和上方行的距离 */
.tree-sub-major{
  position:relative;
  margin-top:6px;
  margin-left:22px;
  padding-left:22px;
  font-size:0.82em;
  color:#555;
}
.tree-sub-major::before{
  content:"└─";
  position:absolute;
  left:0;
  top:0;
  color:#aaa;
}
        </style>
