        <style>
    .cv-tree {
  margin: 18px auto; 
  overflow-x: hidden; 
  max-width: 1600px;
  width: 100%;
}
.cv-tree details {
  margin: 0;
}
.cv-tree summary.cv-tree-title {
  color: #369;
  font-size: 1.2em;
  cursor: pointer;
  padding: 4px 0;
  list-style: revert;
}
.cv-tree-children {
  margin: 8px 0 0 12px;
  padding: 0;
}
.tree-item {
  position: relative;
  margin: 6px 0;
  padding-left: 24px;
  line-height: 1.7;
  font-size: 0.88em;
}
.tree-item::before {
  content: "├─";
  position: absolute;
  left: 0;
  top: 0;
  color: #aaa;
}
.tree-item.last::before {
  content: "└─";
}

/* 学校/公司标题行：两栏布局 名称左 时间右 */
.tree-row {
  display: flex;
  justify-content: space-between;
  width: 100%;
}
.school-name {
  text-align: left;
}
.time {
  white-space: nowrap;
  color:#666;
  text-align: right;
}

/* 专业子条目，缩进，子树符号 */
.tree-sub {
  position:relative;
  margin:4px 0 4px 22px;
  padding-left:22px;
}
.tree-sub::before {
  content:"└─";
  position:absolute;
  left:0;
  top:0;
  color:#aaa;
}
