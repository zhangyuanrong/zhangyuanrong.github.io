        <style>
    .cv-tree {
  margin: 18px auto; 
  overflow-x: hidden; 
  max-width: 1600px;
  width: 100%;
}
.cv-tree details {
  margin: 0;
}
.cv-tree summary.cv-tree-title {
  color: #369;
  font-size: 1.2em;
  cursor: pointer;
  padding: 4px 0;
  list-style: revert;
}
.cv-tree-children {
  margin: 8px 0 0 12px;
  padding: 0;
}
.tree-item {
  position: relative;
  margin: 6px 0;
  padding-left: 24px;
  line-height: 1.7;
  font-size: 0.88em;
}
.tree-item::before {
  content: "├─";
  position: absolute;
  left: 0;
  top: 0;
  color: #aaa;
}
.tree-item.last::before {
  content: "└─";
}

/* 关键：统一三栏结构，所有行时间都从同一位置开始 */
.tree-row {
  display: grid;
  grid-template-columns: 20px 1fr auto;
  gap: 8px 12px;
  width: 100%;
  align-items: baseline;
}
.school-name {
  white-space: nowrap;
  text-align: left;
}
.time {
  white-space: nowrap;
  text-align: left;
  color:#666;
}

/* 折叠行：三角占第一栏，学校占第二栏，时间占第三栏 */
.tree-item details summary {
  list-style:none;
  cursor:pointer;
  display:grid;
  grid-template-columns: 20px 1fr auto;
  gap: 8px 12px;
  align-items: baseline;
  padding: 0;
}
.tree-item details summary::-webkit-details-marker {
  display:none;
}
.tree-item details summary::before {
  content:"▶";
  display:inline-block;
  text-align: center;
  font-size:11px;
  color:#666;
}
.tree-item details[open] summary::before{
  content:"▼";
}

/* 静态行：第一栏放透明占位，保证时间列和上面对齐 */
.tree-item > .tree-row .cv-dummy {
  display: inline-block;
  width: 11px;
  height: 11px;
  margin-left: 4px;
  opacity: 0;
}

/* 专业子条目 */
.tree-sub-major{
  position:relative;
  margin-top:6px;
  margin-left:22px;
  padding-left:22px;
  font-size:0.82em;
  color:#555;
}
.tree-sub-major::before{
  content:"└─";
  position:absolute;
  left:0;
  top:0;
  color:#aaa;
}
