        <style>
    .cv-tree {
  margin: 18px auto; 
  overflow-x: hidden; 
  max-width: 1600px;
  width: 100%;
}
.cv-tree details {
  margin: 0;
}
.cv-tree summary.cv-tree-title {
  color: #369;
  font-size: 1.2em;
  cursor: pointer;
  padding: 4px 0;
  list-style: revert;
}
.cv-tree-children {
  margin: 8px 0 0 12px;
  padding: 0;
}
.tree-item {
  position: relative;
  margin: 6px 0;
  padding-left: 24px;
  line-height: 1.7;
  font-size: 0.88em;
}
.tree-item::before {
  content: "├─";
  position: absolute;
  left: 0;
  top: 0;
  color: #aaa;
}
.tree-item.last::before {
  content: "└─";
}

/* 两栏布局，固定结构保证时间列全部对齐 */
.tree-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  width: 100%;
}
.school-name {
  white-space: nowrap;
  text-align: left;
}
.time {
  white-space: nowrap;
  text-align: left;
  color:#666;
}

/* 自定义折叠三角 */
.tree-item details summary {
  list-style:none;
  cursor:pointer;
  position:relative;
  padding-left:20px;
}
.tree-item details summary::-webkit-details-marker {
  display:none;
}
.tree-item details summary::before {
  content:"▶";
  position:absolute;
  left:0;
  top:1px;
  font-size:11px;
  color:#666;
}
.tree-item details[open] summary::before{
  content:"▼";
}

/* 专业子条目，保持字号更小、垂直间距 */
.tree-sub-major{
  position:relative;
  margin-top:6px;
  margin-left:22px;
  padding-left:22px;
  font-size:0.82em;
  color:#555;
}
.tree-sub-major::before{
  content:"└─";
  position:absolute;
  left:0;
  top:0;
  color:#aaa;
}

/* 给无折叠条目增加左侧占位，和三角宽度保持一致，实现时间对齐 */
.tree-item > .tree-row {
  padding-left: 20px;
  box-sizing: border-box;
}
        </style>
