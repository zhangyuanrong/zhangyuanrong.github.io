        <p>你好，欢迎来看小张~</p>

        <style>
        .cv-box {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.75;
            color: #444;
        }
        /* 清除浏览器默认details圆点 */
        .cv-box details {
            margin-bottom: 4px;
        }
        .cv-box summary {
            cursor: pointer;
            list-style: none;
        }
        .cv-box summary::-webkit-details-marker {
            display: none;
        }
        /* 外层大标题（Work/Education）样式 */
        .cv-section-title {
            color: #369;
            font-size: 15px;
            font-weight: normal;
            padding:4px 0;
            position:relative;
            padding-left:22px;
        }
        .cv-section-title::before {
            content: "▼";
            position: absolute;
            left:0;
            top:3px;
            font-size:13px;
            color:#369;
        }
        .cv-box details[open] > .cv-section-title::before {
            content: "▼";
        }
        .cv-box details:not([open]) > .cv-section-title::before {
            content: "▶";
        }
        /* 每一行学校/公司容器，主干├─ */
        .cv-item {
            position: relative;
            padding-left:24px;
        }
        .cv-item::before {
            content: "├─";
            position:absolute;
            left:0;
            top:0;
            color:#aaa;
        }
        .cv-item:last-child::before {
            content: "└─";
        }
        /* 学校那一行：左边文字，右边时间，自带三角 */
        .cv-item summary {
            display:flex;
            justify-content:space-between;
            align-items:baseline;
            width:100%;
            padding:2px 0;
            position:relative;
            padding-left:22px;
        }
        /* 学校前面的三角 ▶ / ▼ */
        .cv-item summary::before {
            content: "▶";
            position:absolute;
            left:0;
            top:3px;
            font-size:12px;
            color:#666;
        }
        .cv-item details[open] > summary::before {
            content: "▼";
        }
        .cv-school {
            font-size:14px;
            color:#222;
        }
        .cv-time {
            font-size:14px;
            color:#666;
            white-space:nowrap;
        }
        /* 专业子项，字号更小 */
        .cv-major {
            position:relative;
            padding-left:24px;
            font-size:13px;
            color:#555;
        }
        .cv-major::before {
            content:"└─";
            position:absolute;
            left:0;
            top:0;
            color:#aaa;
        }
        </style>

        <div class="cv-box">
