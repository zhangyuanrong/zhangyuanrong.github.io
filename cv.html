        <style>
    .cv-tree {
  margin: 18px auto; 
  overflow-x: hidden; 
  max-width: 1600px;
  width: 100%;
}
.cv-tree details {
  margin: 0;
}
.cv-tree summary.cv-tree-title {
  color: #369;
  font-size: 1.2em;
  cursor: pointer;
  padding: 4px 0;
  list-style: revert;
}
.cv-tree-children {
  margin: 8px 0 0 12px;
  padding: 0;
}
.tree-item {
  position: relative;
  margin: 6px 0;
  padding-left: 24px;
  line-height: 1.7;
  font-size: 0.88em;
}
.tree-item::before {
  content: "├─";
  position: absolute;
  left: 0;
  top: 0;
  color: #aaa;
}
.tree-item.last::before {
  content: "└─";
}
/* 电脑端保持原样：两列布局，右列固定宽度，所有时间在固定框内左对齐 */
.tree-row {
  display: grid;
  grid-template-columns: 1fr 180px;
  gap:8px;
  width:100%;
  align-items: baseline;
}
.school-name {
  text-align:left;
}
.time {
  text-align: left !important;
  white-space:nowrap;
  color:#666;
  justify-self: start !important;
}
/* 折叠项summary，完全相同网格轨道，右列同样180px固定宽度 */
.tree-item details summary {
  display:grid;
  grid-template-columns:1fr 180px;
  gap:8px;
  align-items: baseline;
  list-style:none;
  cursor:pointer;
  position:relative;
  padding-left:20px;
}
.tree-item details summary::-webkit-details-marker {
  display:none;
}
.tree-item details summary::before {
  content:"▶";
  position:absolute;
  left:0;
  top:1px;
  font-size:11px;
  color:#666;
}
.tree-item details[open] summary::before{
  content:"▼";
}
/* 专业子条目 */
.tree-sub-major{
  position:relative;
  margin-top:6px;
  margin-left:22px;
  padding-left:22px;
  font-size:0.82em;
  color:#555;
}
.tree-sub-major::before{
  content:"└─";
  position:absolute;
  left:0;
  top:0;
  color:#aaa;
}
.tree-item > .tree-row {
  padding-left: 20px;
  box-sizing: border-box;
}

/* =========手机端（屏幕宽度≤768px）========= */
@media screen and (max-width:768px) {
  /* 手机缩小整体字体，学校名称强制禁止换行 */
  .tree-item {
    font-size:0.76em;
  }
  .school-name {
    white-space: nowrap !important;
    min-width:0;
  }
  /* 手机两列布局，左自适应，右固定宽度，统一时间左对齐 */
  .tree-row {
    display: grid;
    grid-template-columns: minmax(0,1fr) 110px;
    gap:10px;
  }
  .tree-item details summary {
    display:grid;
    grid-template-columns: minmax(0,1fr) 110px;
    gap:10px;
  }
  .time {
    padding-left:0;
  }
}
