<script>
// @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&dn=expat.txt Expat
    const themePreference = () => {
        const hasLocalStorage = localStorage.getItem('theme');
        let supports = false;
        let theme = undefined;

        if (hasLocalStorage === 'light') {
            theme = 'light';
        }
        if (hasLocalStorage === 'dark') {
            theme = 'dark';
        }

        if (window.matchMedia(`(prefers_color: dark)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'dark';
            supports = true;
        };
        if (window.matchMedia(`(prefers_color: light)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'light';
            supports = true;
        };
        if (window.matchMedia(`(prefers_color: no-preference)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'none';
            supports = true;
        };

        return {
            supports,
            theme
        };
    }

    document.addEventListener('DOMContentLoaded', e => {
        console.clear();

        const userThemePreference = themePreference();
        const toggle = document.querySelector('[theme_toggle]');
        const html = document.documentElement;

        const setTheme = () => {
            switch (userThemePreference.theme) {
                case 'dark':
                    toggle.checked = true;
                    html.classList.add('dark');
                    html.classList.remove('light');
                    break;
                case 'light':
                    toggle.checked = false;
                    html.classList.remove('dark');
                    html.classList.add('light');
                    break;
            }
        }
        setTheme();
        toggle.addEventListener('click', e => {
            if (toggle.checked) {
                html.classList.add('dark');
                html.classList.remove('light');
                localStorage.setItem('theme', 'dark');
            } else {
                html.classList.remove('dark');
                html.classList.add('light');
                localStorage.setItem('theme', 'light');
            }
        }, false);
    }, false);
// @license-end
</script>

<!-- 播放器弹窗：外观完全和截图一致 -->
<div id="musicPanel" style="display:none;position:fixed;top:50%;left:24px;transform:translateY(-50%);background:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 2px 12px #00000022;z-index:9999;width:240px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <span style="font-size:15px;font-weight:600;">Pretender</span>
    <span onclick="closeMusicPanel()" onmousedown="event.stopPropagation()" style="cursor:pointer;font-size:20px;color:#666;padding:0 4px;">×</span>
  </div>

  <div style="margin-bottom:10px;">
    <div id="progressWrap" style="width:100%;height:6px;background:#ddd;border-radius:3px;cursor:pointer;">
      <div id="progressBar" style="width:0%;height:100%;background:#07c160;border-radius:3px;"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#666;margin-top:4px;">
      <span id="currentTime">00:00</span>
      <span id="totalTime">00:00</span>
    </div>
  </div>

  <div style="display:flex;gap:8px;justify-content:flex-start;">
    <button onclick="toggleMusic()" id="playBtn" style="padding:6px 14px;border:none;background:#2b548c;color:#fff;border-radius:6px;cursor:pointer;font-size:13px;">播放/暂停</button>
    <button onclick="toggleLoop()" id="loopBtn" style="padding:6px 10px;border:1px solid #2b548c;background:#fff;color:#2b548c;border-radius:6px;cursor:pointer;font-size:13px;">单曲循环</button>
  </div>
</div>

<script>
// 全局音频对象：切换页面不中断
if(!window.globalAudio){
  window.globalAudio = new Audio("{{ site.baseurl }}/assets/music/Pretender.mp3");
  window.globalAudio.preload = "auto";
}
let audio = window.globalAudio;

let progressWrap, progressBar, currentTimeDom, totalTimeDom, musicPanel, playBtn, loopBtn;
let isAudioInit = false;
let loopState = false;
let isSeeking = false;

function initPlayer(){
  if(isAudioInit) return;

  musicPanel = document.getElementById("musicPanel");
  progressWrap = document.getElementById("progressWrap");
  progressBar = document.getElementById("progressBar");
  currentTimeDom = document.getElementById("currentTime");
  totalTimeDom = document.getElementById("totalTime");
  playBtn = document.getElementById("playBtn");
  loopBtn = document.getElementById("loopBtn");

  audio.addEventListener('loadedmetadata', () => {
    if(!isNaN(audio.duration)){
      totalTimeDom.innerText = formatTime(audio.duration);
    }
  });

  audio.addEventListener('timeupdate', () => {
    // 正在定位的时候，不刷新进度条，避免卡顿
    if(isSeeking) return;
    if(!isNaN(audio.duration)){
      const percent = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = percent + "%";
      currentTimeDom.innerText = formatTime(audio.currentTime);
    }
  });

  // 监听seek开始、结束，解决跳转卡顿
  audio.addEventListener('seeking', ()=>{
    isSeeking = true;
  })
  audio.addEventListener('seeked', async ()=>{
    isSeeking = false;
    // 跳转完成，如果原本是播放状态，继续播放
    if(!audio.paused){
      await audio.play().catch(err=>{});
    }
  })

  audio.addEventListener('play', () => {
    playBtn.innerText = "播放/暂停";
  });

  audio.addEventListener('pause', () => {
    playBtn.innerText = "播放/暂停";
  });

  // 进度条点击：只修改时间，交给seeked事件处理后续播放
  progressWrap.onclick = (e) => {
    if(isNaN(audio.duration)) return;
    const rect = progressWrap.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const width = rect.width;
    audio.currentTime = (clickX / width) * audio.duration;
  };

  isAudioInit = true;
}

function toggleLoop(){
  if(!audio) return;
  loopState = !loopState;
  audio.loop = loopState;

  if(loopState){
    loopBtn.style.background = "#2b548c";
    loopBtn.style.color = "#fff";
    loopBtn.innerText = "单曲循环";
  }else{
    loopBtn.style.background = "#fff";
    loopBtn.style.color = "#2b548c";
    loopBtn.innerText = "单曲循环";
  }
}

function openMusicPanel(){
  musicPanel.style.display = "block";
}

function closeMusicPanel(){
  musicPanel.style.display = "none";
}

function formatTime(sec){
  if(isNaN(sec)) return "00:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
}

function toggleMusic(){
  if (!audio) return;
  if(audio.paused){
    audio.play().catch(err => console.log("播放报错: ", err));
  }else{
    audio.pause();
  }
}

// swup页面切换后重新绑定面板DOM，不重建audio
document.addEventListener('swup:contentReplaced', function () {
  musicPanel = document.getElementById("musicPanel");
  playBtn = document.getElementById("playBtn");
  loopBtn = document.getElementById("loopBtn");
  progressWrap = document.getElementById("progressWrap");
  progressBar = document.getElementById("progressBar");
  currentTimeDom = document.getElementById("currentTime");
  totalTimeDom = document.getElementById("totalTime");
});

document.addEventListener('DOMContentLoaded', initPlayer);
</script>

<script>
// cv自定义局部加载逻辑
document.addEventListener('DOMContentLoaded', function(){
  document.addEventListener('click', function(e){
    const link = e.target.closest('.pjax‑cv‑link');
    if(!link) return;
    e.preventDefault();
    const url = link.getAttribute('href');
    // Catbook主题主内容容器 #main
    const mainDom = document.querySelector('#main');
    if(!mainDom){
      window.location.href = url;
      return;
    }
    fetch(url)
      .then(res=>res.text())
      .then(html=>{
        const parseDoc = new DOMParser().parseFromString(html,"text/html");
        const cvContent = parseDoc.querySelector('#cv-inner-content');
        if(cvContent){
          // 将cv正文写入主内容区，不会跑到侧边header
          mainDom.innerHTML = cvContent.innerHTML;
          // 更新浏览器历史，支持回退
          history.pushState({path:url},'',url);
        }else{
          window.location.href = url;
        }
      })
      .catch(()=>{
        window.location.href = url;
      })
  });

  // 浏览器回退按钮支持：回退到首页时，重新加载首页原始内容
  window.addEventListener('popstate', function(){
    if(!history.state?.path){
      fetch(window.location.origin + window.location.pathname)
        .then(res=>res.text())
        .then(html=>{
          const doc = new DOMParser().parseFromString(html,"text/html");
          const main = document.querySelector('#main');
          if(main) main.innerHTML = doc.querySelector('#main').innerHTML;
        })
    }
  })
})
</script>
